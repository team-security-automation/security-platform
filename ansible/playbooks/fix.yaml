---
- name: KISA vulnerability fix
  hosts: all
  gather_facts: true
  become: yes

  environment:
    LANG: C

  tasks:

    # ==================================================
    # 대상 서버 정보
    # ==================================================

    - name: 대상 서버 정보 확인
      debug:
        msg:
          - "Target: {{ inventory_hostname }}"
          - "Hostname: {{ ansible_hostname }}"
          - "OS: {{ ansible_distribution }}"
          - "Version: {{ ansible_distribution_version }}"

    # ==================================================
    # scan 결과 파일 위치
    # ==================================================

    - name: scan 결과 파일 경로 설정
      set_fact:
        scan_result_file: "{{ playbook_dir }}/../results/{{ inventory_hostname }}_scan.json"

    # ==================================================
    # scan 결과 파일 존재 여부 확인
    # ==================================================

    - name: scan 결과 파일 확인
      stat:
        path: "{{ scan_result_file }}"
      delegate_to: localhost
      become: no
      register: scan_file

    - name: scan 결과가 없으면 중단
      fail:
        msg: >
          {{ scan_result_file }} 파일이 없습니다.
          먼저 scan.yaml을 실행하십시오.
      when: not scan_file.stat.exists

    # ==================================================
    # scan JSON 읽기
    # ==================================================

    - name: scan 결과 읽기
      set_fact:
        scan_data: "{{ lookup('file', scan_result_file) | from_json }}"

    # ==================================================
    # 취약 항목 추출
    # ==================================================

    - name: 취약 항목 목록 초기화
      set_fact:
        vulnerable_ids: []

    - name: 취약 항목 코드 추출
      set_fact:
        vulnerable_ids: "{{ vulnerable_ids + [item.check_id] }}"
      loop: "{{ scan_data }}"
      when: item.status == "취약"

    # ==================================================
    # 취약 항목 확인
    # ==================================================

    - name: 취약 항목 출력
      debug:
        msg: "취약 항목: {{ vulnerable_ids }}"

    # ==================================================
    # 조치용 임시 디렉토리 생성
    # ==================================================

    - name: 조치용 임시 디렉토리 생성
      file:
        path: /tmp/security_fix
        state: directory
        mode: '0755'

    # ==================================================
    # Ubuntu fix 스크립트 전송
    # 자동조치 가능한 항목의 fix.sh만 존재
    # ==================================================

    - name: Ubuntu 조치 스크립트 전송
      copy:
        src: "{{ item }}"
        dest: /tmp/security_fix/
        mode: '0755'
      with_fileglob:
        - "{{ playbook_dir }}/../scripts/ubuntu/acc/*_fix.sh"
        - "{{ playbook_dir }}/../scripts/ubuntu/file/*_fix.sh"
        - "{{ playbook_dir }}/../scripts/ubuntu/ser/*_fix.sh"
        - "{{ playbook_dir }}/../scripts/ubuntu/pat/*_fix.sh"
        - "{{ playbook_dir }}/../scripts/ubuntu/log/*_fix.sh"
      when: ansible_distribution == "Ubuntu"

    # ==================================================
    # Rocky fix 스크립트 전송
    # ==================================================

    - name: Rocky 조치 스크립트 전송
      copy:
        src: "{{ item }}"
        dest: /tmp/security_fix/
        mode: '0755'
      with_fileglob:
        - "{{ playbook_dir }}/../scripts/rocky/acc/*_fix.sh"
        - "{{ playbook_dir }}/../scripts/rocky/file/*_fix.sh"
        - "{{ playbook_dir }}/../scripts/rocky/ser/*_fix.sh"
        - "{{ playbook_dir }}/../scripts/rocky/pat/*_fix.sh"
        - "{{ playbook_dir }}/../scripts/rocky/log/*_fix.sh"
      when: ansible_distribution == "Rocky"

    # ==================================================
    # 전송된 fix 스크립트 검색
    # ==================================================

    - name: 전송된 조치 스크립트 찾기
      find:
        paths: /tmp/security_fix
        patterns: "*_fix.sh"
        file_type: file
      register: fix_scripts

    # ==================================================
    # 존재하는 fix 코드 목록 생성
    # ==================================================

    - name: fix 코드 목록 초기화
      set_fact:
        available_fix_ids: []

    - name: 존재하는 fix 코드 추출
      set_fact:
        available_fix_ids: "{{ available_fix_ids + [fix_id] }}"
      vars:
        fix_id: >-
          {{ (item.path | basename)
             | regex_replace('^u_([0-9]{2})_.*$', 'U-\1') }}
      loop: "{{ fix_scripts.files }}"

    # ==================================================
    # 취약하지만 fix 파일이 없는 항목
    # ==================================================

    - name: 수동조치 대상 계산
      set_fact:
        manual_fix_ids: "{{ vulnerable_ids | difference(available_fix_ids) }}"

    - name: 자동조치 스크립트가 없는 취약 항목
      debug:
        msg: "자동조치 불가 또는 수동조치 필요: {{ manual_fix_ids }}"
      when: manual_fix_ids | length > 0

    # ==================================================
    # 자동조치 실행
    # ==================================================

    - name: 취약 항목 자동조치 실행
      command: "{{ item.path }}"
      vars:
        fix_id: >-
          {{ (item.path | basename)
             | regex_replace('^u_([0-9]{2})_.*$', 'U-\1') }}
      loop: "{{ fix_scripts.files | sort(attribute='path') }}"
      when: fix_id in vulnerable_ids
      register: fix_results
      failed_when: false

    # ==================================================
    # 조치 성공 결과
    # ==================================================

    - name: 정상 조치 결과 확인
      debug:
        msg:
          - "Script: {{ item.item.path | basename }}"
          - "Fix ID: {{ result_json.fix_id }}"
          - "Status: {{ result_json.status }}"
          - "Action: {{ result_json.action }}"
          - "Result: {{ result_json.result }}"
      vars:
        result_json: "{{ item.stdout | from_json }}"
      loop: "{{ fix_results.results }}"
      when:
        - not (item.skipped | default(false))
        - item.rc == 0

    # ==================================================
    # 조치 오류
    # ==================================================

    - name: 조치 스크립트 오류 확인
      debug:
        msg:
          - "Script: {{ item.item.path | basename }}"
          - "Status: 조치 오류"
          - "RC: {{ item.rc }}"
          - "Error: {{ item.stderr }}"
      loop: "{{ fix_results.results }}"
      when:
        - not (item.skipped | default(false))
        - item.rc != 0

    # ==================================================
    # Controller에 조치 결과 저장
    # ==================================================

    - name: 조치 결과 로컬 저장
      copy:
        dest: "{{ playbook_dir }}/../results/{{ inventory_hostname }}_fix.txt"
        content: |
          ==================================================
          KISA Vulnerability Fix Result
          ==================================================

          Target: {{ inventory_hostname }}
          Hostname: {{ ansible_hostname }}
          OS: {{ ansible_distribution }}
          Version: {{ ansible_distribution_version }}

          Vulnerable IDs:
          {{ vulnerable_ids | join(', ') }}

          Manual Fix IDs:
          {{ manual_fix_ids | join(', ') }}

          ==================================================

          {% for result in fix_results.results %}

          {% if not (result.skipped | default(false)) %}

          Script: {{ result.item.path | basename }}

          {% if result.rc == 0 %}

          {% set json = result.stdout | from_json %}

          Fix ID: {{ json.fix_id }}
          Status: {{ json.status }}
          Action: {{ json.action }}
          Result: {{ json.result }}

          {% else %}

          Status: 조치 오류
          RC: {{ result.rc }}
          Error: {{ result.stderr }}

          {% endif %}

          --------------------------------------------------

          {% endif %}

          {% endfor %}
      delegate_to: localhost
      become: no

    # ==================================================
    # 임시 디렉토리 삭제
    # ==================================================

    - name: 조치용 임시 디렉토리 삭제
      file:
        path: /tmp/security_fix
        state: absent
